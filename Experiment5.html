<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1 align="center">Student Registration Form</h1>
    <hr>


    <form action="#" method="post" >
            
            <!-- Full Name -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" placeholder="Enter your full name" name="fullname" required>
            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter valid email address" name="email" required>
            <br><br>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter  password" name="password" required>
            <br><br>

            <!-- Gender -->
            <label type="name" for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">Male</input>
            <input type="radio" id="female" name="gender" value="female">Female</input>
            <input type="radio" id="other" name="gender" value="other">Other</input>
            <br><br>

            <!-- Course Selection -->
            <label for="course">Course:</label> 
            <select id="course" name="course" required>
                <option value="">--Select Course--</option>
                <option value="b-tech">Bachelor of Technology</option>
                <option value="m-tech">Master of Technology</option>
                <option value="bca">Bachelor of Computer Applications</option>
                <option value="mca">Master of Computer Applications</option>
            </select>
            <br><br>

            <!-- Contact Number -->
            <label for="phone">Contact No:</label>
            <input type="tel" id="phone" placeholder="Enter phone number" name="phone">
            <br><br>

            <!-- Address -->
            <label for="address">Address:</label><br>
            <textarea id="address" placeholder="Enter your address" name="address" rows="4" cols="40"></textarea>
        
            <br><br>

            <!-- Action Buttons -->
            <input type="submit" value="Register">
            <input type="reset" value="Clear">

        </form>   

</body>
<hr>
<footer>
    <p align="center">© 2025 Student Registration Portal</p>
    </footer>
</html>
